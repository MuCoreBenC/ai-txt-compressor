[package]
name = "aitxt-compressor"
version = "0.0.2"
edition = "2021"
description = "Semantic text compressor (algo + local Ollama model)"

[[bin]]
name = "compressor"
path = "src/main.rs"

[dependencies]
jieba-rs = "0.7"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
anyhow = "1"
thiserror = "1"
regex = "1"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
